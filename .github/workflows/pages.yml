name: Deploy Barber Manager to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare approved release
        run: |
          set -euo pipefail
          mkdir -p site
          cp -R published-shop/. site/
          cp firebase-config.js site/
          (cd site && sha256sum --strict -c FILES.sha256)
          rm site/FILES.sha256 site/.gitattributes
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
