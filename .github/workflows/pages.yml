name: Deploy Barber Manager V1.10.8.1 Web to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare V1.10.8.1 index
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          parts = [Path(f'.deploy2/part{i:02d}.txt') for i in range(5)]
          missing = [str(p) for p in parts if not p.exists()]
          if missing:
              raise SystemExit('Missing payload files: ' + ', '.join(missing))

          encoded = ''.join(''.join(p.read_text(encoding='utf-8').split()) for p in parts)
          print('payload chars:', len(encoded))
          compressed = base64.b64decode(encoded)
          print('compressed bytes:', len(compressed))
          html = gzip.decompress(compressed)
          print('decoded html bytes:', len(html))
          print('decoded sha256:', hashlib.sha256(html).hexdigest())

          if b'<!doctype html' not in html.lower() or b'Barber Manager' not in html:
              raise SystemExit('Decoded payload is not a valid Barber Manager HTML release')

          # Normalize any earlier test-version labels, then promote V1.10.8 -> V1.10.8.1.
          html = html.replace(b'V1.10.8.1.1', b'V1.10.8.1')
          if b'V1.10.8.1' not in html:
              html = html.replace(b'V1.10.8', b'V1.10.8.1')

          Path('index.html').write_bytes(html)
          print('prepared index bytes:', len(html))
          print('prepared sha256:', hashlib.sha256(html).hexdigest())
          PY
          test -s index.html
          grep -q "Barber Manager" index.html
          grep -q "V1.10.8.1" index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
