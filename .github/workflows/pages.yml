name: Deploy Barber Manager V1.10.8 Web to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare public payload
        shell: bash
        run: |
          mkdir -p payload
          cp .deploy/index.part01 payload/index.part01
          cp .deploy/index.part02 payload/index.part02
          cp .deploy/index.rest01 payload/index.rest01
          cp .deploy/index.rest02 payload/index.rest02
          cp .deploy/index.rest03 payload/index.rest03
          test -s index.html
          test -s payload/index.part01

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
