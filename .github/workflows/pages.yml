name: Deploy Barber Manager V1.10.8 Web to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build full V1.10.8 index
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip

          parts = [
              '.deploy/index.part01',
              '.deploy/index.part02',
              '.deploy/index.rest01',
              '.deploy/index.rest02',
              '.deploy/index.rest03',
          ]
          encoded = ''.join(Path(p).read_text(encoding='utf-8').strip() for p in parts)
          compressed = base64.b64decode(encoded, validate=True)
          html = gzip.decompress(compressed)
          if b'Barber Manager' not in html:
              raise SystemExit('Barber Manager marker not found in rebuilt index')
          Path('index.html').write_bytes(html)
          print(f'Rebuilt index.html: {len(html)} bytes')
          PY
          test -s index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
