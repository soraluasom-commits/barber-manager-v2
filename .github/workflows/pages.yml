name: Deploy Barber Manager to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare approved release
        run: |
          mkdir -p site
          cp index.html sw.js manifest.webmanifest icon.svg site/
          cp staff-photos.js shop-enhancements.js staff-days-off.js firebase-config.js cloud-merge.js cloud-sync.js hair-catalogue.js learning-center.js navigation-groups.js site/
          cp theme-fix.css auth-gate.css ui-refresh.css login-barbershop.webp hair-standard.png hair-fade.png hair-street.png hair-asian.png hair-classic.png hair-long.png hair-texture.png hair-mod-warrior.png site/
          grep -q '2026-11-03-approved' site/index.html
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
