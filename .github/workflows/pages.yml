name: Deploy Barber Manager V1.10.8.1 Web to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release and prepare index
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          parts = [Path(f'.deploy2/part{i:02d}.txt') for i in range(5)]
          encoded = ''.join(''.join(p.read_text(encoding='utf-8').split()) for p in parts)
          compressed = base64.b64decode(encoded)
          html = gzip.decompress(compressed)

          expected = 'e498ccab2089ecbac50882fc7e542af99d389b809b54666c370eec8c5176a266'
          actual = hashlib.sha256(html).hexdigest()
          print('source sha256:', actual)
          if actual != expected:
              raise SystemExit(f'SHA-256 mismatch: expected {expected}, got {actual}')

          if b'Barber Manager' not in html or b'V1.10.8' not in html:
              raise SystemExit('Required Barber Manager V1.10.8 markers not found')

          html = html.replace(b'V1.10.8', b'V1.10.8.1')
          Path('index.html').write_bytes(html)
          print('Prepared index.html bytes:', len(html))
          PY
          test -s index.html
          grep -q "V1.10.8.1" index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
