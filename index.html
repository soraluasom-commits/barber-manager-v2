const PAGES=[['dashboard','🏠','หน้าหลัก'],['summary','🧾','สรุปรายเดือน'],['annual','📆','สรุปข้อมูลประจำปี'],['entry','✂️','บันทึกงาน'],['daily','📅','รายวัน'],['monthly','📊','รายเดือน'],['goals','🎯','เป้าหมาย'],['income','💵','รายรับ'],['expenses','💸','รายจ่าย'],['analytics','📈','วิเคราะห์'],['history','🗂️','ประวัติ'],['staff','👥','จัดการช่างและร้าน'],['backup','💾','สำรองข้อมูล']];
const MENU_ORDER_KEY='barberManagerMenuOrder';
const STAFF_AVATARS=['😎','🧑‍🎤','🥷','🧑‍🚀','🤠','🦸','🧑‍🔧','🕶️'];
let menuReorderMode=false;

function orderedPages(){let saved=[];try{saved=JSON.parse(localStorage.getItem(MENU_ORDER_KEY)||'[]')}catch(e){}const map=Object.fromEntries(PAGES.map(x=>[x[0],x])),valid=Array.isArray(saved)?saved.filter(k=>map[k]):[],rest=PAGES.map(x=>x[0]).filter(k=>!valid.includes(k));return [...valid,...rest].map(k=>map[k])}
function persistMenuOrder(keys){localStorage.setItem(MENU_ORDER_KEY,JSON.stringify(keys))}

function menuDragStart(e,p){if(!menuReorderMode){e.preventDefault();return}e.dataTransfer.setData('text/plain',p);e.dataTransfer.effectAllowed='move';e.currentTarget.classList.add('dragging')}

function menuDragEnd(e){document.querySelectorAll('.nav-row').forEach(x=>x.classList.remove('dragging','drag-over'))}
function menuDrop(e,target){if(!menuReorderMode)return;e.preventDefault();const from=e.dataTransfer.getData('text/plain');document.querySelectorAll('.nav-row').forEach(x=>x.classList.remove('dragging','drag-over'));if(!from||from===target)return;const keys=orderedPages().map(x=>x[0]),a=keys.indexOf(from),b=keys.indexOf(target);if(a<0||b<0)return;keys.splice(a,1);keys.splice(b,0,from);persistMenuOrder(keys);renderNav()}
let state=loadState(); let page='dashboard'; let filters={};
function clone(x){return JSON.parse(JSON.stringify(x))}
function upgrade(d){
 d=d&&typeof d==='object'?d:{}; d.staff=Array.isArray(d.staff)?d.staff:[]; d.entries=Array.isArray(d.entries)?d.entries:[]; d.expenses=Array.isArray(d.expenses)?d.expenses:[]; d.funds=Array.isArray(d.funds)?d.funds:[]; d.monthlySettings=d.monthlySettings||{}; d.expenseCategories=Array.isArray(d.expenseCategories)&&d.expenseCategories.length?d.expenseCategories:['ค่าเช่า','ค่าน้ำ-ค่าไฟ','ค่าอุปกรณ์','ค่าของใช้','เครื่องดื่ม','อื่นๆ'];
 d.shopName=typeof d.shopName==='string'?d.shopName:''; d.entries.forEach(x=>{if(x.notes==null)x.notes=''; if(!x.weekday&&x.date)x.weekday=weekday(x.date)}); d.expenses.forEach(x=>{if(!x.category)x.category='ยังไม่จัดหมวด'}); return d;

function save(msg='บันทึกแล้ว'){localStorage.setItem(STORAGE,JSON.stringify(state));toast(msg);render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function n(v){return Number(v)||0} function money(v){return '฿'+n(v).toLocaleString('th-TH',{maximumFractionDigits:2})} function num(v){return n(v).toLocaleString('th-TH')}
function isoToday(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function currentMonth(){return isoToday().slice(0,7)} function weekday(s){const [y,m,d]=s.split('-').map(Number);return WEEK[new Date(y,m-1,d).getDay()]}
function thDate(s,long=false){if(!s)return '';const [y,m,d]=s.split('-').map(Number);return new Intl.DateTimeFormat('th-TH',{day:'numeric',month:long?'long':'short',year:long?'numeric':undefined}).format(new Date(y,m-1,d))}
function monthLabel(m){const [y,mo]=m.split('-').map(Number);return new Intl.DateTimeFormat('th-TH',{month:'long',year:'numeric'}).format(new Date(y,mo-1,1))}
function id(){return 'id_'+Math.random().toString(36).slice(2,10)}
function sum(a,f=x=>x){return a.reduce((s,x)=>s+n(f(x)),0)}
function byMonth(a,m){return a.filter(x=>x.date?.startsWith(m))} function byDate(a,d){return a.filter(x=>x.date===d)}
function receiptSum(m){return sum(byMonth(state.funds,m),x=>x.amount)}
function expenseSum(m){return sum(byMonth(state.expenses,m),x=>x.amount)}
function allFinanceMonths(){return [...new Set([...state.funds.map(x=>x.date?.slice(0,7)),...state.expenses.map(x=>x.date?.slice(0,7)),...Object.keys(state.monthlySettings||{})].filter(Boolean))].sort()}
function balanceBaseMonth(){const configured=Object.keys(state.monthlySettings||{}).filter(m=>state.monthlySettings[m]&&state.monthlySettings[m].carryOver!=null).sort(),nonZero=configured.filter(m=>n(state.monthlySettings[m]?.carryOver)!==0);return nonZero[0]||configured[0]||allFinanceMonths()[0]||currentMonth()}
function nextMonth(m){let [y,mo]=m.split('-').map(Number);mo++;if(mo===13){mo=1;y++}return `${y}-${String(mo).padStart(2,'0')}`}
function openingBalance(m){const base=balanceBaseMonth();if(m<=base)return n(state.monthlySettings[m]?.carryOver);let cur=base,bal=n(state.monthlySettings[base]?.carryOver);let guard=0;while(cur<m&&guard++<240){bal=bal+receiptSum(cur)-expenseSum(cur);cur=nextMonth(cur)}return bal}
function centralBalance(m){return openingBalance(m)+receiptSum(m)-expenseSum(m)}
function yearOptions(selected){const cy=Number(isoToday().slice(0,4)),dataYears=[...state.entries,...state.funds,...state.expenses].map(x=>Number(x.date?.slice(0,4))).filter(Number.isFinite),oldest=Math.min(cy-10,...dataYears),ys=[];for(let y=cy;y>=oldest;y--)ys.push(String(y));if(selected&&!ys.includes(String(selected)))ys.push(String(selected));return ys.sort((a,b)=>Number(b)-Number(a)).map(y=>`<option value=\"${y}\" ${String(y)===String(selected)?'selected':''}>${Number(y)+543}</option>`).join('')}
function monthCutoffDay(m){const [y,mo]=m.split('-').map(Number),last=new Date(y,mo,0).getDate(),today=isoToday();if(m<today.slice(0,7))return last;if(m>today.slice(0,7))return 0;const td=Number(today.slice(8)),hasToday=state.entries.some(x=>x.date===today);return Math.max(0,Math.min(last,hasToday?td:td-1))}
function weekdayOccurrenceCounts(m){const [y,mo]=m.split('-').map(Number),cut=monthCutoffDay(m),o=Object.fromEntries(WEEK.map(w=>[w,0]));for(let d=1;d<=cut;d++)o[WEEK[new Date(y,mo-1,d).getDay()]]++;return o}

function goalsPage(){const m=filters.goalMonth||currentMonth(),s=state.monthlySettings[m]||{},g=s.goals||{total:{amount:0,heads:0},staff:{}},e=byMonth(state.entries,m),a=sum(e,x=>x.amount),h=sum(e,x=>x.heads);return `<div class="toolbar"><div class="field"><label>เดือน</label><select id="goalMonth">${monthOptions(m)}</select></div></div><div class="card"><div class="section-title"><h2>ตั้งเป้าหมาย • ${monthLabel(m)}</h2></div><form onsubmit="saveGoals(event,'${m}')"><div class="formgrid"><div class="field"><label>เป้ารายได้รวม</label><input name="totalAmount" type="number" value="${n(g.total?.amount)}"></div><div class="field"><label>เป้าลูกค้ารวม</label><input name="totalHeads" type="number" value="${n(g.total?.heads)}"></div><div></div><div></div>${staffNames().map((st,i)=>`<div class="field"><label>${esc(st)} • เป้ารายได้</label><input name="sa${i}" type="number" value="${n(g.staff?.[st]?.amount)}"></div><div class="field"><label>${esc(st)} • เป้าลูกค้า</label><input name="sh${i}" type="number" value="${n(g.staff?.[st]?.heads)}"></div>`).join('')}<div class="span4 actions"><button class="btn primary">บันทึกเป้าหมาย</button></div></div></form></div><br><div class="card"><div class="section-title"><h2>ความคืบหน้า</h2></div>${goalProgressBlock(m,a,h,g)}</div>`}
function goalProgressBlock(m,a,h,g){const pct=(v,t)=>n(t)>0?Math.max(0,Math.min(100,n(v)/n(t)*100)):0,fmtPct=v=>(Math.round(v*10)/10).toLocaleString('th-TH',{maximumFractionDigits:1})+'%';const block=(name,aa,hh,gg,store=false)=>{const pa=pct(aa,gg?.amount),ph=pct(hh,gg?.heads);return `<div class="goal-progress-card ${store?'goal-store':''}"><div class="goal-progress-head"><div class="name">${store?'🏪 ':''}${esc(name)}</div><div class="muted">${money(aa)} • ${num(hh)} ลูกค้า</div></div><div class="goal-progress-metrics"><div class="goal-metric"><div class="goal-metric-top"><span><b>รายได้</b> <span class="value">${money(aa)} / ${money(gg?.amount)}</span></span><span class="goal-percent money">${n(gg?.amount)>0?fmtPct(pa):'—'}</span></div><div class="goal-bar money"><i style="width:${pa}%"></i></div></div><div class="goal-metric"><div class="goal-metric-top"><span><b>จำนวนลูกค้า</b> <span class="value">${num(hh)} / ${num(gg?.heads)} หัว</span></span><span class="goal-percent heads">${n(gg?.heads)>0?fmtPct(ph):'—'}</span></div><div class="goal-bar heads"><i style="width:${ph}%"></i></div></div></div></div>`};const rows=staffNames().map(st=>{const x=byMonth(state.entries,m).filter(e=>e.staff===st),aa=sum(x,z=>z.amount),hh=sum(x,z=>z.heads),gg=g.staff?.[st]||{};return block(st,aa,hh,gg,false)}).join('');return block('รวมร้าน',a,h,g.total||{},true)+rows}
function saveGoals(e,m){e.preventDefault();const f=new FormData(e.target),staff={};staffNames().forEach((s,i)=>staff[s]={amount:n(f.get('sa'+i)),heads:n(f.get('sh'+i))});state.monthlySettings[m]={...(state.monthlySettings[m]||{}),goals:{total:{amount:n(f.get('totalAmount')),heads:n(f.get('totalHeads'))},staff}};save('บันทึกเป้าหมายแล้ว')}
function toggleAnnualDetail(id,btn,label='รายละเอียด'){const box=document.getElementById(id);if(!box)return;const willShow=box.hasAttribute('hidden');if(willShow)box.removeAttribute('hidden');else box.setAttribute('hidden','');if(btn){btn.classList.toggle('is-open',willShow);btn.innerHTML=`<span class="toggle-arrow">▼</span>${willShow?'ซ่อน':'แสดง'}${label}`}}

function incomeMini(a){return a.length?a.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="statline"><span>${esc(x.desc)} <small class="muted">${thDate(x.date)}</small></span><b class="good">＋${money(Math.abs(n(x.amount)))}</b></div>`).join(''):'<div class="empty">ไม่มีรายรับ</div>'}
function centralLedger(m){const rows=[...byMonth(state.funds,m).map(x=>({...x,type:'รายรับ',signed:Math.abs(n(x.amount))})),...byMonth(state.expenses,m).map(x=>({...x,type:'รายจ่าย',signed:-Math.abs(n(x.amount))}))].sort((a,b)=>b.date.localeCompare(a.date));if(!rows.length)return '<div class="empty">ไม่มีรายการในเดือนนี้</div>';return `<div class="tablewrap income-expense-ledger"><table><thead><tr><th>วันที่</th><th>ประเภท</th><th>รายการ</th><th class="num">จำนวน</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${thDate(x.date)}</td><td><span class="pill">${x.type}</span></td><td>${esc(x.desc)}</td><td class="num ${x.signed>=0?'good':'bad'}"><b>${x.signed>=0?'＋':'−'}${money(Math.abs(x.signed))}</b></td></tr>`).join('')}</tbody></table></div>`}

function analyticsPage(){const m=filters.anaMonth||currentMonth(),y=filters.anaYear||m.slice(0,4),e=byMonth(state.entries,m),a=sum(e,x=>x.amount),h=sum(e,x=>x.heads),prev=prevMonth(m),pe=byMonth(state.entries,prev),pa=sum(pe,x=>x.amount),ph=sum(pe,x=>x.heads);const change=(v,p)=>p?((v-p)/p*100):0;return `<div class="toolbar"><div class="field"><label>เดือนวิเคราะห์</label><select id="anaMonth">${monthOptions(m)}</select></div><div class="field"><label>ปีของกราฟเปรียบเทียบ</label><select id="anaYear">${yearOptions(y)}</select></div></div><div class="grid kpis">${kpi('รายได้งานช่าง',money(a),`${change(a,pa)>=0?'▲':'▼'} ${Math.abs(change(a,pa)).toFixed(1)}% จากเดือนก่อน`)}${kpi('ลูกค้า',num(h)+' หัว',`${change(h,ph)>=0?'▲':'▼'} ${Math.abs(change(h,ph)).toFixed(1)}% จากเดือนก่อน`)}${kpi('เฉลี่ย/ลูกค้า',h?money(a/h):'—',monthLabel(m))}${kpi('เดือนก่อน',money(pa),monthLabel(prev))}</div><br><div class="grid two"><div class="card"><div class="section-title"><h2>วันเฉลี่ยที่มีลูกค้ามากที่สุด → น้อยที่สุด</h2></div>${weekdayAverageRanking(m)}</div><div class="card"><div class="section-title"><h2>ค่าเฉลี่ยจำนวนลูกค้าต่อวันของช่าง</h2></div>${staffWorkingDayAverage(m)}</div></div><br><div class="card"><div class="section-title"><h2>เปรียบเทียบจำนวนลูกค้าของช่างรายเดือน • ปี ${Number(y)+543}</h2><span class="muted">ม.ค. – ${chartMonthsForYear(y)===12?'ธ.ค.':monthShort(chartMonthsForYear(y))}</span></div>${customerLineChart(y)}</div><br><div class="grid two"><div class="card"><div class="section-title"><h2>สรุปวันในสัปดาห์</h2></div>${weekdayAnalytics(m)}</div><div class="card"><div class="section-title"><h2>อันดับช่างตามรายได้</h2></div>${staffRanking(m)}</div></div><br><div class="card"><div class="section-title"><h2>10 อันดับวันทำยอดสูงสุด</h2><span class="muted">แสดงสูงสุด 10 อันดับ</span></div>${topDays(m)}</div>`}
function prevMonth(m){let [y,mo]=m.split('-').map(Number);mo--;if(!mo){mo=12;y--}return `${y}-${String(mo).padStart(2,'0')}`}
function weekdayAverageRanking(m){const occ=weekdayOccurrenceCounts(m),em=byMonth(state.entries,m);const rows=WEEK.map(w=>{const total=sum(em.filter(x=>(x.weekday||weekday(x.date))===w),x=>x.heads),days=occ[w]||0;return {w,total,days,avg:days?total/days:0}}).filter(x=>x.days).sort((a,b)=>b.avg-a.avg||b.total-a.total);return rows.length?`<div>${rows.map((r,i)=>`<div class="avg-rank"><div class="badge">${i+1}</div><div><b>${r.w}</b><div class="muted">ลูกค้ารวม ${num(r.total)} หัว ÷ ${num(r.days)} ${r.w}</div></div><b>${r.avg.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2})} หัว/วัน</b></div>`).join('')}</div><div class="notice" style="margin-top:12px">คำนวณแยกเฉพาะ ${monthLabel(m)} และนับจำนวนวันจริงของแต่ละวันในสัปดาห์; เดือนปัจจุบันจะไม่นับวันที่ยังมาไม่ถึง</div>`:'<div class="empty">ไม่มีข้อมูลสำหรับเดือนนี้</div>'}
function staffWorkingDayAverage(m){const rows=staffNames().map(s=>{const z=byMonth(state.entries,m).filter(x=>x.staff===s),h=sum(z,x=>x.heads),days=window.BarberOps?BarberOps.workingDays(s,m):new Set(z.map(x=>x.date).filter(Boolean)).size;return {s,h,days,avg:days?h/days:0}}).filter(x=>x.days>0).sort((a,b)=>b.avg-a.avg||b.h-a.h);return rows.length?rows.map((r,i)=>`<div class="avg-rank"><div class="badge">${i+1}</div><div><b>${esc(r.s)}</b><div class="muted">ลูกค้ารวม ${num(r.h)} หัว ÷ วันทำงาน ${num(r.days)} วัน</div></div><b>${r.avg.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2})} หัว/วัน</b></div>`).join('')+'<div class="notice" style="margin-top:12px">สูตร: จำนวนลูกค้ารวมของช่างในเดือน ÷ จำนวนวันทำงานจริงของช่างในเดือนนั้น นับวันที่มีรายการงานหรือยืนยันมาทำงานแบบไม่ซ้ำกัน รวมวันมาทำงานที่ไม่มีลูกค้า</div>':'<div class="empty">ไม่มีข้อมูลวันทำงานของช่างในเดือนนี้</div>'}
function weekdayAnalytics(m){const occ=weekdayOccurrenceCounts(m),rows=WEEK.map(w=>{const z=byMonth(state.entries,m).filter(x=>(x.weekday||weekday(x.date))===w),a=sum(z,x=>x.amount),h=sum(z,x=>x.heads),d=occ[w]||0;return [w,a,h,d,d?h/d:0]}).filter(x=>x[3]);return `<div class="weekgrid">${rows.map(([w,a,h,d,av])=>`<div class="weekday"><span>${w}</span><b>${av.toLocaleString('th-TH',{minimumFractionDigits:1,maximumFractionDigits:1})} หัว/วัน</b><small class="muted">รวม ${num(h)} หัว • ${d} วัน<br>${money(a)}</small></div>`).join('')}</div>`}

function customerLineChart(y){const count=chartMonthsForYear(y);if(!count)return '<div class="empty">ไม่มีเดือนที่ผ่านมาสำหรับปีนี้</div>';const months=Array.from({length:count},(_,i)=>i+1),names=staffNames(),yearEntries=state.entries.filter(x=>x.date?.startsWith(`${y}-`));if(!yearEntries.length)return `<div class="empty">ยังไม่มีข้อมูลลูกค้าในปี ${Number(y)+543}</div>`;const data=names.map(s=>months.map(m=>sum(state.entries.filter(x=>x.staff===s&&x.date?.startsWith(`${y}-${String(m).padStart(2,'0')}`)),x=>x.heads))),max=Math.max(1,...data.flat()),W=980,H=410,L=60,R=28,T=42,B=54,pw=W-L-R,ph=H-T-B,steps=5,colors=['var(--chart-1)','var(--chart-2)','var(--chart-3)','var(--chart-4)','var(--chart-5)','var(--chart-6)'];const x=i=>L+(months.length===1?pw/2:i*pw/(months.length-1)),yy=v=>T+ph-(v/max*ph),grid=Array.from({length:steps+1},(_,i)=>{const v=max*i/steps,Y=yy(v);return `<line x1="${L}" y1="${Y}" x2="${W-R}" y2="${Y}" stroke="var(--line)" stroke-width="1"/><text x="${L-10}" y="${Y+4}" text-anchor="end" font-size="11" fill="var(--muted)">${Math.round(v)}</text>`}).join(''),labels=months.map((m,i)=>`<text x="${x(i)}" y="${H-18}" text-anchor="middle" font-size="11" fill="var(--muted)">${monthShort(m)}</text>`).join(''),offsets=[-11,17,-25,29,-39,41],lines=data.map((vals,si)=>{const c=colors[si%colors.length],pts=vals.map((v,i)=>`${x(i)},${yy(v)}`).join(' '),points=vals.map((v,i)=>{const px=x(i),py=yy(v),dy=offsets[si%offsets.length],labelY=Math.max(13,Math.min(H-B-5,py+dy));return `<circle cx="${px}" cy="${py}" r="4.5" fill="${c}"><title>${names[si]} • ${monthShort(months[i])} ${Number(y)+543}: ${num(v)} หัว</title></circle><text class="point-value" x="${px}" y="${labelY}" text-anchor="middle" fill="${c}">${num(v)}</text>`}).join('');return `<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${points}`}).join(''),legend=names.map((s,i)=>`<span class="legend-item"><i class="legend-dot" style="background:${colors[i%colors.length]}"></i>${esc(s)}</span>`).join('');return `<div class="chart-wrap"><svg class="linechart" viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟเปรียบเทียบจำนวนลูกค้าของช่างรายเดือน">${grid}<line x1="${L}" y1="${T}" x2="${L}" y2="${H-B}" stroke="var(--muted)"/><line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="var(--muted)"/>${labels}${lines}<text x="16" y="${T+ph/2}" transform="rotate(-90 16 ${T+ph/2})" text-anchor="middle" font-size="12" fill="var(--muted)">จำนวนลูกค้า (หัว)</text></svg></div><div class="chart-legend">${legend}</div><div class="muted" style="font-size:12px;margin-top:8px">ตัวเลขบนแต่ละจุดคือจำนวนลูกค้ารวมของช่างรายนั้นในเดือนนั้น • เลือกปีจากด้านบนเพื่อดูย้อนหลัง</div>`}

function historyPage(){const q=(filters.q||'').toLowerCase(),st=filters.histStaff||'',m=filters.histMonth||'';let a=state.entries.slice().sort((a,b)=>b.date.localeCompare(a.date));if(q)a=a.filter(x=>`${x.date} ${x.staff} ${x.notes||''}`.toLowerCase().includes(q));if(st)a=a.filter(x=>x.staff===st);if(m)a=a.filter(x=>x.date.startsWith(m));return `<div class="card"><div class="section-title"><h2>ประวัติงานทั้งหมด</h2><span class="muted">${num(a.length)} รายการ</span></div><div class="toolbar"><input placeholder="ค้นหา วันที่ / ช่าง / หมายเหตุ" value="${esc(filters.q||'')}" oninput="filters.q=this.value;render()"><select onchange="filters.histStaff=this.value;render()"><option value="">ช่างทั้งหมด</option>${staffNames().map(s=>`<option ${s===st?'selected':''}>${esc(s)}</option>`).join('')}</select><select onchange="filters.histMonth=this.value;render()"><option value="">ทุกเดือน</option>${monthOptions(m)}</select></div>${historyTable(a.slice(0,500))}${a.length>500?'<div class="notice" style="margin-top:12px">แสดง 500 รายการแรกตามตัวกรอง เพื่อให้โปรแกรมทำงานลื่น</div>':''}</div>`}

function staffPage(){const hasShop=!!String(state.shopName||'').trim();return `<div class="grid two"><div class="card"><div class="section-title"><h2>รายชื่อช่าง</h2><button class="btn primary" onclick="addStaff()">＋ เพิ่มช่าง</button></div>${state.staff.map((s,i)=>`<div class="staff-row"><b>${esc(s.name)}</b><div class="muted">${num(state.entries.filter(x=>x.staff===s.name).length)} รายการประวัติ</div><div class="actions"><button class="btn small" onclick="renameStaff(${i})">เปลี่ยนชื่อ</button><button class="btn small danger" onclick="removeStaff(${i})">ลบ</button></div></div>`).join('')}</div><div class="card shop-settings"><div class="section-title"><h2>จัดการร้าน</h2></div><div class="shop-name-card"><div class="muted">ชื่อร้านที่แสดงบนแถบด้านบน</div><div class="current-shop-name">${hasShop?esc(state.shopName):'ยังไม่ได้ตั้งชื่อร้าน'}</div><div class="actions"><button class="btn primary" onclick="editShopName()">${hasShop?'✏️ แก้ไขชื่อร้าน':'＋ เพิ่มชื่อร้าน'}</button>${hasShop?'<button class="btn ghost" onclick="clearShopName()">ล้างชื่อร้าน</button>':''}</div></div><div><h3>การจัดการชื่อช่างและร้าน</h3><p class="muted">การเปลี่ยนชื่อช่างจะอัปเดตประวัติรายการงานและเป้าหมายรายเดือนให้ตรงกันทั้งหมด ส่วนการลบรายชื่อช่างจะไม่ลบประวัติเก่า ชื่อร้านจะถูกเก็บพร้อมข้อมูลโปรแกรมและรวมอยู่ใน Backup JSON</p></div></div></div>`}
function addStaff(){const name=prompt('ชื่อช่างใหม่');if(!name?.trim())return;if(staffNames().includes(name.trim()))return toast('มีชื่อนี้แล้ว');state.staff.push({name:name.trim()});save('เพิ่มช่างแล้ว')}

function backupPage(){const dup=duplicateCount();return `<div class="grid two"><div class="card"><div class="section-title"><h2>สำรอง / นำเข้าข้อมูล</h2></div><p class="muted">ข้อมูลใช้งานหลักเก็บในเบราว์เซอร์เครื่องนี้ และสามารถสร้าง Snapshot สำรองไว้ใน IndexedDB ได้ฟรี</p><div class="actions"><button class="btn primary" onclick="createIDBSnapshot(true)">🗄️ สำรองลง IndexedDB</button><button class="btn" onclick="restoreLatestIDBSnapshot()">↩️ กู้คืน Snapshot ล่าสุด</button><button class="btn" onclick="saveBackupAs()">💾 Export JSON</button><label class="btn">⬆ นำเข้า JSON<input type="file" accept=".json,application/json" onchange="importJSON(this.files[0])" hidden></label><button class="btn" onclick="exportAllCSV()">📊 Export CSV</button></div><br><div class="notice"><b>IndexedDB Snapshot:</b> เก็บข้อมูลสำรองไว้ภายในเบราว์เซอร์/อุปกรณ์นี้ สูงสุด 20 ชุด และไม่ส่งข้อมูลร้านขึ้น GitHub</div><br><div class="notice"><b>สำคัญ:</b> IndexedDB ไม่ซิงก์ข้ามเครื่องอัตโนมัติ หากต้องการย้ายข้อมูลระหว่างมือถือกับคอมให้ใช้ Export JSON → Import JSON</div></div><div class="card"><div class="section-title"><h2>ตรวจสุขภาพข้อมูล</h2></div>${healthRow('รายการงาน',state.entries.length)}${healthRow('รายจ่าย',state.expenses.length)}${healthRow('รายรับ',state.funds.length)}${healthRow('รายการวันที่+ช่างซ้ำ',dup,dup?'warn':'good')}<div style="margin-top:14px" class="muted" id="idbBackupStatus">กำลังตรวจ IndexedDB…</div></div></div><br><div class="card dangerzone"><div class="section-title"><h2>รีเซ็ตโปรแกรม</h2></div><p class="muted">รีเซ็ตเป็นข้อมูลว่างสำหรับเว็บ ก่อนรีเซ็ตระบบจะสร้าง Snapshot ลง IndexedDB ให้อัตโนมัติ</p><button class="btn danger" onclick="resetSeedWeb()">ล้างข้อมูลในเครื่องนี้</button></div><div class="footer">Barber Manager V1.10.8.1 Web • Base V1.10.7 • PWA + IndexedDB Snapshot</div>`}
function healthRow(l,v,c=''){return `<div class="statline"><span>${l}</span><b class="${c}">${num(v)}</b></div>`}
function duplicateCount(){const m=new Map;state.entries.forEach(x=>{const k=x.date+'|'+x.staff;m.set(k,(m.get(k)||0)+1)});return [...m.values()].filter(n=>n>1).length}
function del(k,i){if(!confirm('ยืนยันลบรายการนี้?'))return;state[k]=state[k].filter(x=>x.id!==i);save('ลบแล้ว')}
function modal(h){const box=document.getElementById('modalbox'),overlay=document.getElementById('modal');box.innerHTML=h;box.scrollTop=0;overlay.classList.add('open');document.body.classList.add('modal-open');requestAnimationFrame(()=>{overlay.scrollTop=0;box.scrollTop=0})} function closeModal(){document.getElementById('modal').classList.remove('open');document.body.classList.remove('modal-open')}
const IDB_DB='barberManagerWebBackups';
const IDB_STORE='snapshots';
const IDB_MAX=20;
function openBackupDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(IDB_DB,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(IDB_STORE))db.createObjectStore(IDB_STORE,{keyPath:'id',autoIncrement:true})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function createIDBSnapshot(showToast=false){try{const db=await openBackupDB();const tx=db.transaction(IDB_STORE,'readwrite'),store=tx.objectStore(IDB_STORE);store.add({createdAt:new Date().toISOString(),data:clone(state),version:'1.10.8'});await new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});const tx2=db.transaction(IDB_STORE,'readwrite'),s2=tx2.objectStore(IDB_STORE),all=await new Promise((res,rej)=>{const r=s2.getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)});if(all.length>IDB_MAX){all.sort((a,b)=>a.id-b.id).slice(0,all.length-IDB_MAX).forEach(x=>s2.delete(x.id))}await new Promise((res,rej)=>{tx2.oncomplete=res;tx2.onerror=()=>rej(tx2.error)});db.close();if(showToast)toast('สำรอง Snapshot ลง IndexedDB แล้ว');updateIDBBackupStatus();return true}catch(e){console.error(e);if(showToast)alert('ไม่สามารถสำรอง IndexedDB ได้ในเบราว์เซอร์นี้');return false}}
async function latestIDBSnapshot(){const db=await openBackupDB();const tx=db.transaction(IDB_STORE,'readonly'),store=tx.objectStore(IDB_STORE);const all=await new Promise((res,rej)=>{const r=store.getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)});db.close();return all.sort((a,b)=>b.id-a.id)[0]||null}
async function restoreLatestIDBSnapshot(){try{const snap=await latestIDBSnapshot();if(!snap){alert('ยังไม่มี Snapshot ใน IndexedDB');return}if(!confirm(`กู้คืน Snapshot วันที่ ${new Date(snap.createdAt).toLocaleString('th-TH')} และแทนที่ข้อมูลปัจจุบันหรือไม่?`))return;state=upgrade(clone(snap.data));localStorage.setItem(STORAGE,JSON.stringify(state));toast('กู้คืน Snapshot สำเร็จ');render()}catch(e){console.error(e);alert('กู้คืน Snapshot ไม่สำเร็จ')}}
async function updateIDBBackupStatus(){const el=document.getElementById('idbBackupStatus');if(!el)return;try{const db=await openBackupDB();const tx=db.transaction(IDB_STORE,'readonly'),store=tx.objectStore(IDB_STORE);const all=await new Promise((res,rej)=>{const r=store.getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)});db.close();if(!all.length){el.textContent='IndexedDB: ยังไม่มี Snapshot';return}all.sort((a,b)=>b.id-a.id);el.textContent=`IndexedDB: ${all.length} Snapshot • ล่าสุด ${new Date(all[0].createdAt).toLocaleString('th-TH')}`}catch(e){el.textContent='IndexedDB: ไม่พร้อมใช้งาน'}}
async function resetSeedWeb(){if(!confirm('ล้างข้อมูลทั้งหมดในเบราว์เซอร์เครื่องนี้จริงหรือไม่?'))return;await createIDBSnapshot(false);state=upgrade(clone(SEED));localStorage.removeItem(STORAGE);save('ล้างข้อมูลในเครื่องนี้แล้ว')}
function download(name,text,type='application/json'){const b=new Blob([text],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function saveBackupAs(){
 const out={...state,appMeta:{app:'Barber Manager V1.10.8.1 Web — Base V1.10.7',exportedAt:new Date().toISOString()}};
 const name=`barber_backup_${isoToday()}.json`;
 const text=JSON.stringify(out,null,2);
 if('showSaveFilePicker' in window){
  try{
   const handle=await window.showSaveFilePicker({
    id:'barber-manager-backup',
    suggestedName:name,
    types:[{description:'Barber Manager Backup (JSON)',accept:{'application/json':['.json']}}],
    excludeAcceptAllOption:false
   });
   const writable=await handle.createWritable();
   await writable.write(new Blob([text],{type:'application/json'}));
   await writable.close();
   toast('บันทึก Backup เรียบร้อยแล้ว');
   return;
  }catch(err){
   if(err && err.name==='AbortError'){toast('ยกเลิกการบันทึก Backup');return;}
   console.warn('Save picker unavailable, falling back to download:',err);
  }
 }
 download(name,text);
 toast('เบราว์เซอร์นี้ใช้หน้าต่างเลือกที่เก็บไม่ได้ จึงดาวน์โหลด Backup แบบปกติแทน');
}
function downloadBackup(){return saveBackupAs()}
function importJSON(file){if(!file)return;const r=new FileReader;r.onload=async()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.entries)||!Array.isArray(d.staff))throw Error('รูปแบบไม่ตรง');if(confirm(`พบ ${d.entries.length} รายการงาน ต้องการแทนที่ข้อมูลปัจจุบันหรือไม่?`)){await createIDBSnapshot(false);state=upgrade(d);save('นำเข้าข้อมูลสำเร็จ')}}catch(e){alert('นำเข้าไม่ได้: ไฟล์ JSON ไม่ใช่รูปแบบข้อมูลร้านที่รองรับ')}};r.readAsText(file,'utf-8')}
function csvCell(v){v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function csv(rows){return '\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n')}
function exportAllCSV(){const rows=[['วันที่','วัน','ช่าง','รายได้','จำนวนลูกค้า','หมายเหตุ'],...state.entries.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(x=>[x.date,weekday(x.date),x.staff,x.amount,x.heads,x.notes||''])];download(`barber_entries_${isoToday()}.csv`,csv(rows),'text/csv;charset=utf-8');toast('Export CSV แล้ว')}
function exportMonthCSV(m){const rows=[['วันที่','วัน','ช่าง','รายได้','จำนวนลูกค้า','หมายเหตุ'],...byMonth(state.entries,m).sort((a,b)=>a.date.localeCompare(b.date)).map(x=>[x.date,weekday(x.date),x.staff,x.amount,x.heads,x.notes||''])];download(`barber_${m}.csv`,csv(rows),'text/csv;charset=utf-8')}
function resetSeed(){if(!confirm('คืนค่าข้อมูลต้นฉบับจริงหรือไม่?'))return;state=upgrade(clone(SEED));localStorage.removeItem(STORAGE);save('คืนค่าข้อมูลต้นฉบับแล้ว')}

if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn));
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
loadTheme();
render();
