<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin ตัวกรองสินค้า</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f6f7f8;color:#111}.wrap{max-width:980px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px;margin-bottom:14px}.row{display:flex;gap:8px;flex-wrap:wrap}input,select,button{font:inherit;padding:10px 12px;border:1px solid #d1d5db;border-radius:10px}button{cursor:pointer;font-weight:700}.primary{background:#111;color:#fff;border-color:#111}.muted{color:#666;font-size:13px}.group{border-top:1px solid #eee;padding-top:12px;margin-top:12px}.product{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid #eee}.product img{width:64px;height:64px;object-fit:contain}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:6px 9px;border-radius:999px;background:#f3f4f6}.toolbar{position:sticky;top:0;background:#f6f7f8;padding:10px 0;z-index:2}.status{font-weight:700}.ok{color:#087f23}.bad{color:#b42318}</style></head><body><div class="wrap"><h1>จัดการตัวกรองสินค้า V2.3</h1><div class="card"><div class="row"><input id="key" type="password" placeholder="Admin key"><button id="login" class="primary">เชื่อมต่อ</button></div><p class="muted">คีย์จะเก็บเฉพาะในเบราว์เซอร์เครื่องนี้</p><div id="status" class="status"></div></div><div id="app" hidden><div class="card"><h2>กลุ่มตัวกรอง</h2><div id="groups"></div><button id="addGroup">+ เพิ่มกลุ่ม</button><button id="saveGroups" class="primary">บันทึกตัวกรอง</button></div><div class="card"><div class="toolbar"><h2>กำหนดตัวกรองให้สินค้า</h2><input id="search" placeholder="ค้นหาชื่อ/รหัสสินค้า"><span id="count"></span></div><div id="products"></div></div></div></div><script src="admin-v23.js"></script></body></html>
